name: Test

on:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install
      # lint type-checks docs/ and playground/, which have their own dependencies
      - run: bun install --cwd docs
      - run: bun install --cwd playground
      - run: bun run format:check
      - run: bun run lint
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install
      # No --with-deps: the runner image already has Chromium's libraries, and apt only added CJK/Thai fonts the
      # fixtures don't use, while making the job depend on Ubuntu's mirrors (their DNS failing broke CI)
      - run: bunx playwright install chromium
      - run: bun run test:e2e